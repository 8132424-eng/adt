<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Political Philosophers · Quotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f9f7f4; color: #1e1e2a; line-height: 1.5; padding: 1.5rem 1rem;
    }
    .container {
      max-width: 1100px; margin: 0 auto; background: #fff;
      border-radius: 2rem; box-shadow: 0 12px 30px rgba(0,0,0,.05);
      padding: 2rem 2rem 2.5rem;
    }
    .lang-bar {
      display: flex; justify-content: flex-end; gap: .5rem;
      margin-bottom: 1.5rem; font-size: .9rem;
    }
    .lang-bar button {
      background: #eaeef2; border: none; padding: .35rem .85rem;
      border-radius: 30px; cursor: pointer; font: inherit;
      transition: background .2s, color .2s;
    }
    .lang-bar button:hover { background: #dde3e9; }
    .lang-bar button.active { background: #1e1e2a; color: #fff; font-weight: 500; }

    h1 { font-size: 2.2rem; font-weight: 600; margin-bottom: .5rem; color: #0e1a2b; }
    h2 { font-size: 1.7rem; font-weight: 500; margin-bottom: 1.25rem;
         border-left: 5px solid #b7a68b; padding-left: 1rem; }
    .subhead { color: #4f5b6b; margin-bottom: 2rem; font-size: 1.1rem; }

    .top-nav {
      display: flex; flex-wrap: wrap; gap: .75rem 1.5rem;
      margin-bottom: 2rem; padding-bottom: .75rem;
      border-bottom: 2px solid #e4ddd4;
    }
    .top-nav a {
      font-weight: 500; padding: .4rem .2rem; color: #2c3e4e;
      border-bottom: 2px solid transparent; transition: border-color .2s;
      cursor: pointer;
    }
    .top-nav a:hover { border-bottom-color: #b7a68b; }

    .authors-grid { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 1rem; }
    .author-card {
      flex: 1 1 220px; background: #f4f1ec; padding: 1.75rem 1.5rem;
      border-radius: 1.5rem; border: 1px solid #e5dfd7; text-align: center;
      transition: transform .15s, box-shadow .2s;
    }
    .author-card:hover { transform: translateY(-3px); box-shadow: 0 12px 22px -8px rgba(0,0,0,.1); }
    .author-card h3 { font-size: 1.5rem; font-weight: 500; margin-bottom: .5rem; }
    .author-card .years { font-size: .9rem; color: #6b6b7a; margin-bottom: 1.2rem; }
    .author-card .btn {
      display: inline-block; background: #1e2a36; color: #fff;
      padding: .5rem 1.4rem; border-radius: 40px; font-size: .9rem;
      cursor: pointer; border: none; font: inherit;
    }
    .author-card .btn:hover { background: #2f4050; }

    .quote-list { display: flex; flex-direction: column; gap: 2rem; margin-top: 1.5rem; }
    .quote-item {
      background: #faf8f5; padding: 1.5rem 1.8rem; border-radius: 1.5rem;
      border-left: 6px solid #b7a68b;
    }
    .quote-text { font-size: 1.2rem; font-style: italic; margin-bottom: .8rem; line-height: 1.6; }
    .quote-source {
      font-size: .9rem; color: #5a6675; display: flex;
      justify-content: space-between; flex-wrap: wrap; gap: .5rem;
    }
    .quote-lang {
      background: #e4ddd4; padding: .2rem .75rem; border-radius: 20px;
      font-size: .75rem; font-weight: 600; text-transform: uppercase;
    }
    .back-link { display: inline-block; margin-top: 2rem; color: #4f5b6b;
      border-bottom: 1px dashed #b7a68b; cursor: pointer; }
    .back-link:hover { color: #1e1e2a; border-bottom-style: solid; }

    @media (max-width: 600px) {
      .container { padding: 1.5rem 1.25rem; }
      h1 { font-size: 1.8rem; } h2 { font-size: 1.4rem; }
      .quote-item { padding: 1.25rem; } .quote-text { font-size: 1.05rem; }
    }
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>
<div class="container">

  <!-- LANGUAGE BUTTONS — only EN and FI -->
  <div class="lang-bar" id="langBar">
    <button data-lang="en" class="active">EN</button>
    <button data-lang="fi">FI</button>
  </div>

  <nav class="top-nav" id="topNav"></nav>

  <div id="home" class="page active">
    <h1 id="homeTitle"></h1>
    <p class="subhead" id="homeSub"></p>
    <div class="authors-grid" id="authorsGrid"></div>
  </div>

  <div id="authorPage" class="page">
    <h2 id="authorName"></h2>
    <div class="quote-list" id="quoteList"></div>
    <a class="back-link" data-page="home" id="backLink"></a>
  </div>

  <div style="margin-top:2.5rem;font-size:.8rem;color:#8a8a98;border-top:1px solid #e4ddd4;padding-top:1.5rem;text-align:center;">
    Political philosophers quotes · original English · interface in EN, FI
  </div>
</div>

<script>
/* =========================================================
   1. UI TRANSLATIONS — English + Finnish only
   ========================================================= */
const ui = {
  en: {
    homeTitle: "Useful quotes from great political philosophers",
    homeSub: "A small curated collection — original English texts with multilingual interface.",
    quotesBtn: "Quotes →",
    back: "← Back to home",
    home: "Home"
  },
  fi: {
    homeTitle: "Hyödyllisiä sitaatteja suurilta poliittisilta filosofeilta",
    homeSub: "Pieni valikoima — alkuperäiset englanninkieliset tekstit ja monikielinen käyttöliittymä.",
    quotesBtn: "Sitaatit →",
    back: "← Takaisin etusivulle",
    home: "Etusivu"
  }
};

/* =========================================================
   2. AUTHORS + QUOTES DATA
   Each quote: text in en + fi (fi optional, falls back to en),
   source per language, originLang marks the original language.
   ========================================================= */
const authors = [
  {
    id: "tocqueville",
    name: "Alexis de Tocqueville",
    years: "1805 – 1859",
    quotes: [
      {
        originLang: "en",
        text: {
          en: "The greatness of America lies not in being more enlightened than any other nation, but rather in her ability to repair her faults.",
          fi: "Amerikan suuruus ei ole siinä, että se olisi valistuneempi kuin muut kansat, vaan kyvyssä korjata virheensä."
        },
        source: {
          en: "Democracy in America",
          fi: "Demokratia Amerikassa"
        }
      },
      {
        originLang: "en",
        text: {
          en: "Liberty cannot be established without morality, nor morality without faith.",
          fi: "Vapautta ei voi perustaa ilman moraalia, eikä moraalia ilman uskoa."
        },
        source: {
          en: "Democracy in America",
          fi: "Demokratia Amerikassa"
        }
      }
    ]
  },
  {
    id: "jefferson",
    name: "Thomas Jefferson",
    years: "1743 – 1826",
    quotes: [
      {
        originLang: "en",
        text: {
          en: "I cannot live without books.",
          fi: "En voi elää ilman kirjoja."
        },
        source: {
          en: "letter to John Adams",
          fi: "kirje John Adamsille"
        }
      },
      {
        originLang: "en",
        text: {
          en: "The tree of liberty must be refreshed from time to time with the blood of patriots and tyrants.",
          fi: "Vapauden puuta on ajoittain virvoitettava patrioottien ja tyrannien verellä."
        },
        source: {
          en: "letter to William S. Smith",
          fi: "kirje William S. Smithille"
        }
      }
    ]
  }
];

/* =========================================================
   3. STATE + RENDER
   ========================================================= */
let currentLang = "en";
let currentPage = "home"; // "home" or author id

const $ = sel => document.querySelector(sel);

function t(key) {
  return (ui[currentLang] && ui[currentLang][key]) || ui.en[key];
}

// pick text in current language, fallback to English
function pick(obj) {
  if (!obj) return "";
  return obj[currentLang] || obj.en || "";
}

function renderNav() {
  const nav = $("#topNav");
  let html = `<a data-page="home">${t("home")}</a>`;
  authors.forEach(a => {
    html += `<a data-page="${a.id}">${a.name}</a>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll("a").forEach(el => {
    el.addEventListener("click", () => {
      currentPage = el.dataset.page;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

function renderHome() {
  $("#homeTitle").textContent = t("homeTitle");
  $("#homeSub").textContent = t("homeSub");
  const grid = $("#authorsGrid");
  grid.innerHTML = authors.map(a => `
    <div class="author-card">
      <h3>${a.name}</h3>
      <div class="years">${a.years}</div>
      <button class="btn" data-page="${a.id}">${t("quotesBtn")}</button>
    </div>
  `).join("");
  grid.querySelectorAll("[data-page]").forEach(el => {
    el.addEventListener("click", () => {
      currentPage = el.dataset.page;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

function renderAuthor(author) {
  $("#authorName").textContent = author.name;
  const list = $("#quoteList");
  list.innerHTML = author.quotes.map(q => {
    const text = pick(q.text);
    const src = pick(q.source);
    const langLabel = currentLang.toUpperCase();
    return `
      <div class="quote-item">
        <div class="quote-text">“${text}”</div>
        <div class="quote-source">
          <span>— ${author.name}${src ? ", " + src : ""}</span>
          <span class="quote-lang">${langLabel}</span>
        </div>
      </div>
    `;
  }).join("");
  $("#backLink").textContent = t("back");
  $("#backLink").onclick = () => { currentPage = "home"; render(); };
}

function render() {
  document.querySelectorAll("#langBar button").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === currentLang);
  });
  renderNav();

  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  if (currentPage === "home") {
    $("#home").classList.add("active");
    renderHome();
  } else {
    const author = authors.find(a => a.id === currentPage);
    if (!author) { currentPage = "home"; return render(); }
    $("#authorPage").classList.add("active");
    renderAuthor(author);
  }
}

/* =========================================================
   4. LANGUAGE SWITCH HANDLER
   ========================================================= */
document.querySelectorAll("#langBar button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentLang = btn.dataset.lang;
    render();
  });
});

/* =========================================================
   5. INIT
   ========================================================= */
render();
</script>
</body>
</html>
```
